pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
    }
}

rootProject.name = 'yokowave-minecraft'
includeBuild '../java-sdk'
include 'common'
def loader = providers.gradleProperty('loader').getOrElse('fabric')
if (!(loader in ['fabric', 'forge', 'neoforge'])) throw new GradleException('Unknown loader: ' + loader)
include loader
