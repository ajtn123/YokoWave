name: Java SDK

on:
  push:
    branches: [main]
    tags: ['java-sdk-v*.*.*']
    paths: ['modules/java-sdk/**', '.github/workflows/java-sdk.yml']
  pull_request:
    branches: [main]
    paths: ['modules/java-sdk/**', '.github/workflows/java-sdk.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate SDK release version
        if: startsWith(github.ref, 'refs/tags/java-sdk-v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^sdk_version=//p' modules/java-sdk/gradle.properties)
          test "$TAG" = "java-sdk-v$version"
      - name: Build and test SDK
        working-directory: modules/java-sdk
        run: bash gradlew build --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: java-sdk
          path: modules/java-sdk/build/libs/*.jar
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/java-sdk-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: java-sdk
          path: release
      - name: Publish SDK release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/*.jar --verify-tag --title "Java SDK ${TAG#java-sdk-}" --generate-notes --latest=false
