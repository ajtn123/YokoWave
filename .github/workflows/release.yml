name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate version and tag
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/get-release-version.ps1 -Product Desktop -Tag $env:RELEASE_TAG -OutputFile $env:GITHUB_OUTPUT

  test:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.version.outputs.commit }}

  package:
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, runtime: win-x64 }
          - { os: windows-latest, runtime: win-arm64 }
          - { os: ubuntu-latest, runtime: linux-x64 }
          - { os: ubuntu-latest, runtime: linux-arm64 }
          - { os: macos-latest, runtime: osx-x64 }
          - { os: macos-latest, runtime: osx-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.commit }}
      - name: Publish and package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_RUNTIME: ${{ matrix.runtime }}
        run: ./scripts/package-release.ps1 -Runtime $env:RELEASE_RUNTIME -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.runtime }}
          path: |
            artifacts/release/*.zip
            artifacts/release/*.tar.gz
          if-no-files-found: error

  release:
    needs: [version, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts/release
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: ./scripts/publish-release.ps1 -Tag $env:RELEASE_TAG
