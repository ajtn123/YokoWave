name: Minecraft

on:
  push:
    branches: [main]
    tags: ['minecraft-v*.*.*']
    paths: ['modules/minecraft/**', 'modules/java-sdk/**', 'locales/minecraft/**', '.github/workflows/minecraft.yml']
  pull_request:
    branches: [main]
    paths: ['modules/minecraft/**', 'modules/java-sdk/**', 'locales/minecraft/**', '.github/workflows/minecraft.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { loader: fabric, minecraft: '1.20.1' }
          - { loader: fabric, minecraft: '1.21.1' }
          - { loader: forge, minecraft: '1.20.1' }
          - { loader: neoforge, minecraft: '1.21.1' }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate independent release version
        if: startsWith(github.ref, 'refs/tags/minecraft-v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^mod_version=//p' modules/minecraft/gradle.properties)
          test "$TAG" = "minecraft-v$version"
      - name: Build and test
        working-directory: modules/minecraft
        env:
          LOADER: ${{ matrix.loader }}
          MINECRAFT: ${{ matrix.minecraft }}
        run: bash gradlew build --no-daemon "-Ploader=$LOADER" "-Pminecraft_version=$MINECRAFT"
      - uses: actions/upload-artifact@v7
        with:
          name: minecraft-${{ matrix.loader }}-${{ matrix.minecraft }}
          path: modules/minecraft/${{ matrix.loader }}/build/libs/*.jar
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/minecraft-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: minecraft-*
          merge-multiple: true
          path: release
      - name: Publish Minecraft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/*.jar --verify-tag --title "Minecraft ${TAG#minecraft-}" --generate-notes --latest=false
