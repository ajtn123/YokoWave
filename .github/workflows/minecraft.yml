name: Minecraft

on:
  push:
    branches: [main]
    tags: ['minecraft-v*.*.*']
    paths: ['modules/minecraft/**', 'modules/java-sdk/**', 'modules/sdk-version.txt', 'locales/minecraft/**', 'scripts/get-release-version.ps1', '.github/workflows/minecraft.yml']
  pull_request:
    branches: [main]
    paths: ['modules/minecraft/**', 'modules/java-sdk/**', 'modules/sdk-version.txt', 'locales/minecraft/**', 'scripts/get-release-version.ps1', '.github/workflows/minecraft.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { loader: fabric, minecraft: '1.20.1' }
          - { loader: fabric, minecraft: '1.21.1' }
          - { loader: forge, minecraft: '1.20.1' }
          - { loader: neoforge, minecraft: '1.21.1' }
    steps:
      - uses: actions/checkout@v7
      - name: Validate independent release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./scripts/get-release-version.ps1 -Product Minecraft -Tag $env:RELEASE_TAG
      - name: Build and test
        working-directory: modules/minecraft
        env:
          LOADER: ${{ matrix.loader }}
          MINECRAFT: ${{ matrix.minecraft }}
        run: bash gradlew build --no-daemon "-Ploader=$LOADER" "-Pminecraft_version=$MINECRAFT"
      - uses: actions/upload-artifact@v7
        with:
          name: minecraft-${{ matrix.loader }}-${{ matrix.minecraft }}
          path: modules/minecraft/${{ matrix.loader }}/build/libs/*.jar
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/minecraft-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: minecraft-*
          merge-multiple: true
          path: release
      - name: Publish Minecraft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/*.jar --verify-tag --title "Minecraft ${TAG#minecraft-}" --generate-notes --latest=false
