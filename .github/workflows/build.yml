name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Test
        run: dotnet test -c Release

      - name: Check redundant code
        run: dotnet format style YokoWave.slnx --no-restore --verify-no-changes --diagnostics IDE0005 IDE0060 --severity info
