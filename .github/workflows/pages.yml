name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'modules/**'
      - 'locales/**'
      - 'src/YokoWave.App/Assets/YokoWave.svg'
      - 'docs/assets/social-preview.png'
      - 'scripts/build-pages.ps1'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Assemble static site and module catalog
        shell: pwsh
        run: ./scripts/build-pages.ps1
      - uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
